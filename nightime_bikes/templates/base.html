<!-- Base del html. Esta sera la conexion directa para herencia con los demas templates -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NighTime Bikes</title>
    <!-- Enlace al css -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Enlace para usar FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Conexion con el header -->
    {% include 'header.html' %}
    <!-- Bloque de contenido de herencia -->
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <!-- conexion con el footer -->
    {% include 'footer.html' %}
</body>
</html>
