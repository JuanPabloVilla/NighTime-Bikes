{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="max-width: 600px;">
    <h2 style="text-align: center; color: var(--morado-oscuro);">{{ titulo }}</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-fields">
            {{ form.as_p }}
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn-aplicar" style="flex: 1;">Guardar Cambios</button>
            <a href="{% url volver %}" class="btn-delete" style="flex: 1; text-align: center; padding: 12px; border: 2px solid #f44336; border-radius: 8px; text-decoration: none; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
